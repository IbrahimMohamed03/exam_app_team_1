publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # Networking
  dio: ^5.4.0
  pretty_dio_logger: ^1.4.0
  retrofit: ^4.9.0

  # Logging & Utils
  logger: ^2.6.0

